<!DOCTYPE html>
<html lang = "ko">

<head>
   <meta charset = "utf-8">
   <title>girl's secret</title>
   <link rel = "stylesheet" href = "css/common.css">
   <link rel = "stylesheet" href = "css/groupmain.css">
</head>

<body class = "page page-groupmain">

   <div class="left-area">

      <div class="team-name-area">
         <label for="team-name" class="make-name">Enter your team name</label>

         <div class="input-wrapper">
            <input type="text" id="team-name" class="input-name">
            <img src="images/enter.png" class="enter-icon">
         </div>
      </div>

      <div class="create-code">
         <div class="make-code">Create Invite Code</div>
         <img src="/images/create-code.png" class="show-code">
      </div>

      <div class="enter-code">
         <div class="invite-code">Enter your invite code</div>
         <img src="images/invite-code.png" class="invite-code-image">
         <button type="button" id="enter-btn" class="enter-btn">→ Enter</button>
      </div>
   </div>

   <div class="right-area">
      <div class="choose-team">My Team Lists</div>
      <img src="/images/team-list.png" class="team-list-image">
   </div>

   <script src = "js/api.js"></script>
   <script src = "/js/groupmain.js"></script>

</body>
