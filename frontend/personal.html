   <div class = "personal-right">

      <div class = "personal-move-area">
         <a href = "personal.html" class = "move-personal-btn">
            <img src = "images/move-personal-btn.png">
         </a>
         <a href = "groupmain.html" class = "move-groupmain-btn">

         </a>
      </div>

      <div class = "personal-textarea">

         <div class = "date-area">
            <label for = "date" class = "date-label">date</label>
            <input type = "date" id = "date" class = "date-input">
         </div>
         
         <div class="time-area">
            <label class="time-text">time</label>
            <div class="time-box">
               <input type="time" id="start_time" class="time-input" step="1800">
               <span class="time-wave">~</span>
               <input type="time" id="end_time" class="time-input" step="1800">
            </div>
         </div>

         <div class = "title-area">
            <label for = "title" class = "input-text">title</label>
            <input type = "text" id = "title" class = "input-box">
         </div>

         <div class = "location-area">
            <label for = "location" class = "input-text">place</label>
            <input type = "text" id = "location" class = "input-box">
         </div>

         <div class = "color-area">
            <div class = "color-text">color</div>

            <div class = "color-box">
               <div class="color-circle" data-color="#F4A7A1"></div>
               <div class="color-circle" data-color="#A8E6CF"></div>
               <div class="color-circle" data-color="#C7B6E6"></div>
               <div class="color-circle" data-color="#F7C6D9"></div>
               <div class="color-circle" data-color="#F6E58D"></div>
            </div>
         </div>
      </div>

      <div class = "personal-save-area">
         <button type="button" id="save-btn" class="save-btn">
            save
         </button>

         <button type="button" id="traveltime-btn" class="traveltime-btn" disabled>
            travel time
         </button>
      </div>

      <div id="context-menu" class="context-menu hidden">
         <button id="context-delete-btn" type="button">삭제</button>
